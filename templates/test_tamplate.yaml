inputs:
  - key: input1
    value: 12345678
    description: This is the first input for the template.
    format: 8 number digits
    required: true
  - key: input2
    description: This is the second input for the template.
    format: string
    required: false

procedures:
  - description: This procedure processes the first input and generates an output based on it.
    inputs: [input1, input2]
    outputs:
      - key: output1
        description: This is the output generated from processing input1.
        format: string
    executions:
      - type: cua
        system: EPA
        steps: |
          1. Process <input1> to extract relevant information.
             - finished conditions: input1 has been successfully processed to extract necessary information.
          2. Generate output1 from the extracted information.
             - finished conditions: output1 has been generated and stored.
