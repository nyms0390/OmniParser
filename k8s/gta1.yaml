# --- AKS: Azure Blob PVC (comment out for local testing) ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gta1-models-pvc
  namespace: omni
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: azure-blob-weights
  volumeName: gta1-models-blob   # pre-created blob container name
