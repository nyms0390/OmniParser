# --- AKS: Azure Blob PVC (comment out for local testing) ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omniparser-weights-pvc
  namespace: omni
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: azure-blob-weights
  volumeName: omniparser-weights-blob   # pre-created blob container name
