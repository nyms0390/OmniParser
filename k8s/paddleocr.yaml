# --- AKS: Azure Blob PVC (comment out for local testing) ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paddleocr-models-pvc
  namespace: omni
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage:    # fill in: e.g. 5Gi
  storageClassName: azure-blob-weights
  volumeName: paddleocr-models-blob   # pre-created blob container name
